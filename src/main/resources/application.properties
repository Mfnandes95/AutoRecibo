# ==========================================
# Configuração do Banco de Dados H2 (Em Memória)
# ==========================================
spring.datasource.url=jdbc:h2:mem:autorecibo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ==========================================
# Configurações do JPA (Hibernate) e Flyway
# ==========================================
# Flyway desativado por enquanto — sem Postgres, o Hibernate cria as tabelas direto
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console visual do H2 no navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# Configurações de JWT
# ==========================================
jwt.secret=chave-secreta-apenas-para-desenvolvimento-1234567890
jwt.expiration=3600000