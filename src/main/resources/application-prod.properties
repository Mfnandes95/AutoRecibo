# Configuração do Banco de Dados PostgreSQL no Supabase (Ambiente de Produção)
# Projeto: AutoRecibo (ref: ewyircatwaityzznpqtv | Região: sa-east-1)
# URL do Projeto: https://ewyircatwaityzznpqtv.supabase.co

spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://db.ewyircatwaityzznpqtv.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexões otimizado para Supabase (Supavisor / Direct Connection)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.h2.console.enabled=false

server.forward-headers-strategy=framework
server.error.include-message=always
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Em produção, JWT_SECRET deve ser obrigatoriamente fornecido via variável de ambiente
jwt.secret=${JWT_SECRET}
