# Configuração do Banco de Dados PostgreSQL no Supabase
# Substitua os valores abaixo com os dados do seu projeto Supabase:
# Project Settings -> Database -> Connection string -> URI ou JDBC

spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://db.[YOUR-PROJECT-REF].supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:[YOUR-PASSWORD]}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.h2.console.enabled=false

