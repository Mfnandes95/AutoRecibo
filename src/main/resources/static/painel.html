<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu painel - AutoRecibo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: '#059669', brandHover: '#047857' } } } }
    </script>
</head>
<body class="bg-[#F8FAFC] flex h-dvh overflow-hidden font-sans">

    <aside id="sidebar" class="bg-white w-64 border-r border-gray-100 flex-col hidden md:flex">
        <div class="h-20 flex items-center px-6">
            <div class="w-8 h-8 bg-brand rounded-lg flex items-center justify-center mr-3">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            </div>
            <span class="text-xl font-bold text-gray-800 tracking-tight">AutoRecibo</span>
        </div>
        <nav class="flex-1 px-4 py-4">
            <a href="painel.html" aria-current="page" class="flex items-center px-3 py-2.5 bg-emerald-50/70 text-brand rounded-xl font-medium">Meu painel</a>
        </nav>
        <div class="p-4">
            <div class="bg-gray-50 rounded-xl p-4 border border-gray-100">
                <p id="usuario" class="text-sm font-medium text-gray-900 truncate"></p>
                <button id="sair" class="text-xs text-gray-500 hover:text-gray-900 underline mt-1">Sair da conta</button>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="md:hidden h-16 bg-white border-b border-gray-100 flex items-center px-4">
            <button id="menu" aria-label="Abrir menu" class="text-gray-500">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
        </header>

        <div class="flex-1 overflow-y-auto p-4 sm:p-8">
            <h1 id="saudacao" class="text-2xl font-bold text-gray-900"></h1>
            <p id="data" class="text-gray-500 mt-1 mb-8"></p>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5 mb-8">
                <div class="bg-white p-6 rounded-2xl border border-gray-100">
                    <p class="text-sm font-medium text-gray-500 mb-1">Itens no catálogo</p>
                    <p id="total" class="text-3xl font-bold text-gray-900">–</p>
                </div>
                <div class="bg-white p-6 rounded-2xl border border-gray-100">
                    <label for="arquivo" class="text-sm font-medium text-gray-700 block mb-2">Importar planilha (.xlsx, até 5 MB)</label>
                    <input type="file" id="arquivo" accept=".xlsx" class="block w-full text-sm text-gray-600 file:mr-3 file:rounded-lg file:border-0 file:bg-emerald-50 file:px-3 file:py-2 file:text-brand file:font-medium">
                    <button id="importar" class="mt-3 bg-brand hover:bg-brandHover disabled:opacity-60 text-white text-sm px-4 py-2 rounded-xl font-medium">Importar itens</button>
                </div>
            </div>

            <div id="aviso" role="alert" hidden class="mb-5"></div>

            <section class="bg-white rounded-2xl border border-gray-100 overflow-hidden">
                <h2 class="px-6 py-5 border-b border-gray-100 text-lg font-bold text-gray-900">Seu catálogo</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-50/50 text-gray-500">
                            <tr><th class="px-6 py-3 font-medium">Item</th><th class="px-6 py-3 font-medium">Preço</th></tr>
                        </thead>
                        <tbody id="itens" class="divide-y divide-gray-100 text-gray-700"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        Sessao.exigir();
        const email = Sessao.email();
        $('usuario').textContent = email;
        $('sair').onclick = () => Sessao.sair();
        $('menu').onclick = () => $('sidebar').classList.toggle('hidden');

        const h = new Date().getHours();
        $('saudacao').textContent = (h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite') + '!';
        $('data').textContent = 'Hoje é ' + new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }) + '.';

        function linha(a, b, cls = '') {
            const tr = document.createElement('tr');
            [a, b].forEach((t) => {
                const td = document.createElement('td');
                td.className = 'px-6 py-3 ' + cls;
                td.textContent = t;   // textContent: nomes vindos da planilha nunca viram HTML
                tr.appendChild(td);
            });
            return tr;
        }

        async function carregar() {
            try {
                const d = await api('/api/catalogo');
                const lista = Array.isArray(d) ? d : (d?.content ?? []);
                $('total').textContent = lista.length;
                const corpo = $('itens'); corpo.replaceChildren();
                if (!lista.length) {
                    const tr = linha('Seu catálogo está vazio. Importe uma planilha .xlsx para começar.', '', 'text-gray-500');
                    corpo.appendChild(tr); return;
                }
                lista.forEach((i) => {
                    const preco = i.preco ?? i.valor ?? i.valorUnitario;
                    corpo.appendChild(linha(i.nome ?? i.descricao ?? '—', preco == null ? '—' : brl(preco)));
                });
            } catch (e) { aviso($('aviso'), e.message); }
        }

        $('importar').onclick = async () => {
            const f = $('arquivo').files[0];
            if (!f) return aviso($('aviso'), 'Escolha uma planilha .xlsx.');
            if (!f.name.toLowerCase().endsWith('.xlsx')) return aviso($('aviso'), 'O arquivo precisa ser .xlsx.');
            if (f.size > 5 * 1024 * 1024) return aviso($('aviso'), 'A planilha passa de 5 MB.');
            const form = new FormData(); form.append(CFG.campoArquivo, f);
            await enviar(null, $('importar'), $('aviso'), async () => {
                await api('/api/catalogo/importar', { metodo: 'POST', form });
                aviso($('aviso'), 'Planilha importada.', true);
                $('arquivo').value = '';
                await carregar();
            });
        };

        carregar();
    </script>
</body>
</html>
