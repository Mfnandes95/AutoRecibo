<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta - AutoRecibo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: '#059669', brandHover: '#047857' } } } }
    </script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen font-sans p-4">

    <main class="bg-white p-8 sm:p-10 rounded-2xl shadow-sm w-full max-w-md border border-gray-100">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Crie sua conta</h1>
        <p class="text-gray-500 text-sm leading-relaxed mb-8">Leva um minuto. Depois é só importar seu catálogo e emitir.</p>

        <form id="form" class="space-y-5" novalidate>
            <div id="erro" role="alert" hidden></div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
                <input type="email" id="email" autocomplete="email" required
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none">
            </div>
            <div>
                <label for="documento" class="block text-sm font-medium text-gray-700 mb-1.5">CPF ou CNPJ</label>
                <input type="text" id="documento" inputmode="numeric" autocomplete="off" required
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none">
            </div>
            <div>
                <label for="senha" class="block text-sm font-medium text-gray-700 mb-1.5">Senha (mínimo 8 caracteres)</label>
                <input type="password" id="senha" autocomplete="new-password" minlength="8" required
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none">
            </div>
            <div>
                <label for="confirma" class="block text-sm font-medium text-gray-700 mb-1.5">Repita a senha</label>
                <input type="password" id="confirma" autocomplete="new-password" required
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none">
            </div>
            <button type="submit" id="criar"
                class="w-full bg-brand hover:bg-brandHover disabled:opacity-60 text-white font-medium py-3 rounded-xl transition-all shadow-sm">
                Criar conta
            </button>
        </form>

        <p class="mt-8 text-center text-sm text-gray-500">
            Já tem conta? <a href="index.html" class="text-brand font-medium hover:underline">Entrar</a>
        </p>
    </main>

    <script src="js/app.js"></script>
    <script>
        const erro = $('erro');
        $('form').addEventListener('submit', (ev) => {
            ev.preventDefault();
            const email = $('email').value.trim().toLowerCase();
            const documento = soDigitos($('documento').value);
            const senha = $('senha').value;

            if (!/^\S+@\S+\.\S+$/.test(email)) return aviso(erro, 'Informe um email válido.');
            if (documento.length !== 11 && documento.length !== 14) return aviso(erro, 'O CPF tem 11 números e o CNPJ tem 14.');
            if (senha.length < 8) return aviso(erro, 'A senha precisa ter no mínimo 8 caracteres.');
            if (senha !== $('confirma').value) return aviso(erro, 'As senhas não são iguais.');

            enviar(ev.target, $('criar'), erro, async () => {
                await api('/api/auth/registro', { metodo: 'POST', corpo: { email, documento, senha } });
                location.href = 'index.html?cadastro=ok';
            });
        });
    </script>
</body>
</html>
