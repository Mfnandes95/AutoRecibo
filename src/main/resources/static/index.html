<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - AutoRecibo</title>
    <!-- Tailwind via CDN serve para desenvolvimento; em produção gere o CSS com o Tailwind CLI. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: '#059669', brandHover: '#047857' } } } }
    </script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen font-sans p-4">

    <main class="bg-white p-8 sm:p-10 rounded-2xl shadow-sm w-full max-w-md border border-gray-100">
        <div class="mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-50 mb-6 border border-emerald-100">
                <span class="text-2xl" aria-hidden="true">👋</span>
            </div>
            <h1 class="text-2xl font-bold text-gray-800 mb-2">Que bom ver você!</h1>
            <p class="text-gray-500 text-sm leading-relaxed">Entre para emitir recibos e ordens de serviço em poucos cliques.</p>
        </div>

        <form id="loginForm" class="space-y-5" novalidate>
            <div id="erro" role="alert" hidden></div>

            <div>
                <label for="login" class="block text-sm font-medium text-gray-700 mb-1.5">Email, CPF ou CNPJ</label>
                <input type="text" id="login" autocomplete="username" autocapitalize="none" required
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none transition-all">
            </div>

            <div>
                <label for="senha" class="block text-sm font-medium text-gray-700 mb-1.5">Senha</label>
                <input type="password" id="senha" autocomplete="current-password" required
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-brand/20 focus:border-brand outline-none transition-all">
            </div>

            <button type="submit" id="entrar"
                class="w-full bg-brand hover:bg-brandHover disabled:opacity-60 text-white font-medium py-3 rounded-xl transition-all shadow-sm mt-2">
                Entrar
            </button>
        </form>

        <p class="mt-8 text-center text-sm text-gray-500">
            Ainda não tem conta? <a href="cadastro.html" class="text-brand font-medium hover:underline">Criar conta</a>
        </p>
    </main>

    <script src="js/app.js"></script>
    <script>
        if (Sessao.token) location.replace('painel.html');
        const erro = $('erro');
        if (new URLSearchParams(location.search).get('cadastro') === 'ok') {
            aviso(erro, 'Conta criada. Entre com seu email, CPF ou CNPJ.', true);
        }

        $('loginForm').addEventListener('submit', (ev) => {
            ev.preventDefault();
            const bruto = $('login').value.trim();
            const senha = $('senha').value;
            if (!bruto || !senha) return aviso(erro, 'Preencha o login e a senha.');
            // Email vai em minúsculas; CPF/CNPJ vai só com números.
            const login = bruto.includes('@') ? bruto.toLowerCase() : soDigitos(bruto);

            enviar(ev.target, $('entrar'), erro, async () => {
                const dados = await api('/api/auth/login', { metodo: 'POST', corpo: { [CFG.campoLogin]: login, senha } });
                const token = dados?.[CFG.campoToken];
                if (!token) throw new Error('Resposta inesperada do servidor.');
                Sessao.salvar(token);
                location.href = 'painel.html';
            });
        });
    </script>
</body>
</html>
